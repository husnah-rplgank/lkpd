<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>latihan button</title>
    <style>
        .button_pakai_css {
            background-color: #133357;
            color: white;
            padding: 10px 20px;
            margin-left: 20px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <button class="button_biasa">Tombol Bawaan</button>
    <button class="button_pakai_css">Tombol Modern</button>
</body>
</html>
