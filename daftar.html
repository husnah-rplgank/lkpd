<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Ekskul RPL</title>
</head>
<body>

  <h1>Formulir Pendaftaran Ekskul RPL</h1>

  <form>
    <label>Nama Lengkap:</label><br>
    <input type="text" placeholder="Ketik namamu di sini"><br><br>

    <label>Tanggal Lahir:</label><br>
    <input type="date"><br><br>

    <label>Nomor HP/WA:</label><br>
    <input type="number" placeholder="Ketik Nomormu di sini"><br><br>

    <button type="submit">Daftar</button>
  </form>

</body>
</html>
